# Prebuilt binaries for every tag (owner request 2026-07-11) and a Homebrew
# formula committed back to this repo (owner request 2026-07-29): users
# install with `brew tap ladec-iadvize/idz-k8s https://github.com/ladec-iadvize/idz-k8s
# && brew install idz-k8s` and update with `brew upgrade` — no go build.
version: 2

builds:
  - main: ./cmd/idz-k8s
    binary: idz-k8s
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# NOTE: `brews` is deprecated in favor of macOS-only casks, but a FORMULA is
# the right vehicle here: it serves Linuxbrew too and avoids the Gatekeeper
# quarantine dance casks impose on unsigned binaries. Supported for all of
# goreleaser v2 (the workflow pins "~> v2").
brews:
  - name: idz-k8s
    # The formula lives in THIS repo (Formula/idz-k8s.rb) — no separate tap
    # repo; the release workflow's GITHUB_TOKEN can push to its own repo.
    repository:
      owner: ladec-iadvize
      name: idz-k8s
      branch: main
    directory: Formula
    commit_msg_template: "docs(brew): formula {{ .Tag }}"
    homepage: https://github.com/ladec-iadvize/idz-k8s
    description: "Kubernetes overview, debugging & admin TUI"
    test: |
      system "#{bin}/idz-k8s", "--version"

release:
  draft: false
  footer: |
    Kubernetes overview, debugging & admin TUI — see the [README](https://github.com/ladec-iadvize/idz-k8s#readme) for usage and install (Homebrew supported).
